<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Private</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --ink:#1f2733; --muted:#5b6675; --faint:#8a94a6;
    --line:#e5e8ee; --line-soft:#eef1f5;
    --navy:#1e3a5f; --accent:#2563eb; --accent-soft:#e9f0fc;
    --amber:#b45309; --amber-soft:#fbf1e3; --amber-line:#eed6b3;
    --cyan:#0e7490; --cyan-soft:#e2f2f5; --purple:#6d28d9; --purple-soft:#efe9fb;
    --field:#ffffff; --shadow:0 1px 2px rgba(20,30,50,.05),0 6px 20px rgba(20,30,50,.06);
    --serif:'Spectral',Georgia,'Times New Roman',serif;
    --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#0f1520; --panel:#161d2b; --ink:#e6eaf1; --muted:#9aa6b8; --faint:#6f7c92;
    --line:#26303f; --line-soft:#1d2634;
    --navy:#9fbbe2; --accent:#6ea8fe; --accent-soft:#16233a;
    --amber:#e0a86a; --amber-soft:#251c11; --amber-line:#42341f;
    --cyan:#4bb8cf; --cyan-soft:#122a30; --purple:#b79cf5; --purple-soft:#211a34;
    --field:#0f1520; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }}
  :root[data-theme="dark"]{
    --bg:#0f1520; --panel:#161d2b; --ink:#e6eaf1; --muted:#9aa6b8; --faint:#6f7c92;
    --line:#26303f; --line-soft:#1d2634;
    --navy:#9fbbe2; --accent:#6ea8fe; --accent-soft:#16233a;
    --amber:#e0a86a; --amber-soft:#251c11; --amber-line:#42341f;
    --cyan:#4bb8cf; --cyan-soft:#122a30; --purple:#b79cf5; --purple-soft:#211a34;
    --field:#0f1520; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
    font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%; }
  a{ color:var(--accent); }
  ::selection{ background:var(--accent-soft); }

  #gate{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:22px; }
  .gcard{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:30px 28px;
    width:100%; max-width:430px; box-shadow:var(--shadow); }
  .glock{ font-size:26px; }
  .gcard h1{ font-family:var(--serif); font-weight:600; font-size:22px; margin:.5rem 0 .3rem; }
  .gcard p{ font-size:14px; color:var(--muted); margin:0 0 18px; }
  #f{ display:flex; flex-direction:column; gap:10px; }
  #pw{ width:100%; padding:13px 14px; font-size:16px; font-family:var(--sans); background:var(--field);
    color:var(--ink); border:1px solid var(--line); border-radius:10px; outline:none; }
  #pw:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  #go{ padding:13px; font-size:15px; font-weight:600; font-family:var(--sans); color:#fff;
    background:var(--accent); border:0; border-radius:10px; cursor:pointer; }
  #go:disabled{ opacity:.85; }
  #err{ color:var(--amber); font-size:13.5px; margin-top:12px; min-height:18px; line-height:1.4; }

  .masthead{ background:var(--navy); color:#eaf1fb; }
  .mast-inner{ max-width:1160px; margin:0 auto; padding:34px 26px 30px; }
  .eyebrow{ font-family:var(--mono); text-transform:uppercase; letter-spacing:.16em; font-size:11px;
    color:#a9c2e6; margin:0 0 10px; }
  .masthead h1{ font-family:var(--serif); font-weight:600; font-size:clamp(28px,5vw,42px); line-height:1.08;
    margin:0 0 12px; text-wrap:balance; }
  .lede{ max-width:64ch; font-size:16px; color:#cdddf1; margin:0 0 16px; }
  .mast-meta{ display:flex; flex-wrap:wrap; gap:8px 20px; margin:0; font-size:12.5px; color:#93b0d8;
    font-family:var(--mono); }

  .layout{ max-width:1160px; margin:0 auto; display:grid; grid-template-columns:248px 1fr; align-items:start; }
  .menu{ position:sticky; top:0; align-self:start; display:flex; flex-direction:column; gap:2px;
    padding:22px 14px 22px 26px; }
  .menu button{ appearance:none; text-align:left; font-family:var(--sans); font-size:14.5px; color:var(--muted);
    background:transparent; border:0; border-radius:8px; padding:9px 12px; cursor:pointer; line-height:1.25;
    border-left:2px solid transparent; }
  .menu button:hover{ color:var(--ink); background:var(--line-soft); }
  .menu button.on{ color:var(--navy); background:var(--accent-soft); font-weight:600; }
  .menu button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .panels{ padding:26px 26px 60px; min-width:0; }
  .panel{ animation:fade .28s ease; }
  @keyframes fade{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion:reduce){ .panel{ animation:none; } }
  .p-title{ font-family:var(--serif); font-weight:600; font-size:27px; margin:6px 0 6px; letter-spacing:-.01em; }
  .p-intro{ color:var(--muted); max-width:66ch; margin:0 0 22px; }
  .sub{ font-family:var(--serif); font-weight:600; font-size:18px; margin:30px 0 12px; }
  .sub.critical-h{ display:flex; align-items:center; gap:9px; color:var(--amber); }
  .warn-dot{ display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px;
    border-radius:50%; background:var(--amber); color:#fff; font-weight:700; font-size:14px; flex:none; }
  .fineprint{ font-size:12.5px; color:var(--faint); max-width:70ch; }

  .statrow{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:4px 0 8px; }
  .stat{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:15px 16px;
    display:flex; flex-direction:column; gap:3px; box-shadow:var(--shadow); }
  .stat-k{ font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .stat-v{ font-family:var(--serif); font-weight:600; font-size:26px; color:var(--navy);
    font-variant-numeric:tabular-nums; }
  .stat-s{ font-size:12px; color:var(--faint); }

  .callrow{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .callout{ border-radius:12px; padding:16px 18px; border:1px solid var(--line); background:var(--panel); }
  .callout.critical{ background:var(--amber-soft); border-color:var(--amber-line); }
  .callout.info{ background:var(--cyan-soft); border-color:transparent; }
  .call-tag{ font-family:var(--mono); text-transform:uppercase; letter-spacing:.1em; font-size:10.5px;
    color:var(--amber); margin:0 0 6px; }
  .callout.info .call-tag{ color:var(--cyan); }
  .call-h{ font-family:var(--serif); font-weight:600; font-size:16px; margin:0 0 6px; color:var(--ink); }
  .callout p{ margin:0 0 6px; font-size:14px; }
  .callout p:last-child{ margin-bottom:0; }

  ol.steps{ margin:0; padding:0; list-style:none; counter-reset:s; display:flex; flex-direction:column; gap:10px; }
  ol.steps li{ counter-increment:s; position:relative; padding:12px 14px 12px 46px; background:var(--panel);
    border:1px solid var(--line); border-radius:10px; font-size:14.5px; }
  ol.steps li::before{ content:counter(s); position:absolute; left:12px; top:11px; width:24px; height:24px;
    background:var(--navy); color:#fff; border-radius:50%; font-family:var(--mono); font-size:13px;
    display:flex; align-items:center; justify-content:center; }
  ol.gaps{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px; }
  ol.gaps li{ display:flex; gap:12px; align-items:flex-start; padding:11px 14px; background:var(--panel);
    border:1px solid var(--line); border-radius:10px; font-size:14.5px; }
  .gnum{ flex:none; width:24px; height:24px; border-radius:50%; background:var(--accent-soft); color:var(--navy);
    font-family:var(--mono); font-size:13px; display:flex; align-items:center; justify-content:center; font-weight:500; }

  .cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:13px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 17px;
    box-shadow:var(--shadow); }
  .card h4{ font-family:var(--serif); font-weight:600; font-size:16.5px; margin:0 0 2px; }
  .card .role{ font-size:12px; color:var(--accent); font-weight:500; margin:0 0 9px; text-transform:uppercase;
    letter-spacing:.04em; }
  .card p{ font-size:13.5px; margin:0 0 7px; color:var(--ink); }
  .card p:last-child{ margin-bottom:0; }
  .mono{ font-family:var(--mono); font-size:12.5px; color:var(--muted); word-break:break-word; }
  .need,.need-inline{ color:var(--amber); font-size:12.5px; }

  .tablewrap{ overflow-x:auto; border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); }
  table.ledger{ width:100%; border-collapse:collapse; background:var(--panel); font-size:13.5px; }
  table.ledger:not(.money){ border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .ledger th{ text-align:left; font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--muted); padding:11px 14px; background:var(--line-soft); border-bottom:1px solid var(--line); }
  .ledger td{ padding:11px 14px; border-bottom:1px solid var(--line-soft); vertical-align:top; }
  .ledger tr:last-child td{ border-bottom:0; }
  .ledger .num{ text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .ledger .need-inline{ font-family:var(--sans); }

  .chip{ display:inline-block; font-size:11px; font-weight:500; padding:2px 8px; border-radius:999px;
    line-height:1.5; white-space:nowrap; vertical-align:middle; }
  .chip.done{ background:var(--accent-soft); color:var(--accent); }
  .chip.prog{ background:var(--amber-soft); color:var(--amber); }
  .chip.need{ background:transparent; color:var(--amber); border:1px solid var(--amber-line); }
  .chip.will{ background:var(--purple-soft); color:var(--purple); }
  .chip.info{ background:var(--cyan-soft); color:var(--cyan); }
  .chip.crit{ background:var(--amber); color:#fff; }

  .twocol{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .col{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 18px 16px;
    box-shadow:var(--shadow); }
  ul.ticks{ margin:6px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px; }
  ul.ticks li{ font-size:13.5px; padding-left:20px; position:relative; }
  ul.ticks li::before{ content:''; position:absolute; left:2px; top:8px; width:7px; height:7px; border-radius:2px; }
  .col.keep ul.ticks li::before{ background:var(--cyan); }
  .col.cut ul.ticks li::before{ background:var(--amber); }

  .doc-foot{ max-width:1160px; margin:0 auto; padding:20px 26px 46px; border-top:1px solid var(--line);
    color:var(--faint); font-size:12.5px; }
  .printbtn{ font-family:var(--sans); font-size:13px; font-weight:600; color:#fff; background:var(--ink);
    border:0; border-radius:8px; padding:9px 16px; cursor:pointer; margin-bottom:12px; }

  @media (max-width:860px){
    .layout{ grid-template-columns:1fr; }
    .menu{ flex-direction:row; overflow-x:auto; gap:4px; padding:10px 14px; top:0; z-index:9;
      background:var(--bg); border-bottom:1px solid var(--line); -webkit-overflow-scrolling:touch; }
    .menu button{ white-space:nowrap; border-left:0; border-bottom:2px solid transparent; border-radius:8px; }
    .menu button.on{ border-bottom-color:transparent; }
    .panels{ padding:22px 18px 60px; }
    .statrow{ grid-template-columns:1fr 1fr; }
    .callrow,.twocol{ grid-template-columns:1fr; }
    .mast-inner{ padding:26px 20px 24px; }
  }
  @media (max-width:440px){ .statrow{ grid-template-columns:1fr 1fr; } }

  @media print{
    #gate{ display:none !important; }
    .menu,.printbtn{ display:none !important; }
    .layout{ display:block; }
    .panels .panel{ display:block !important; margin-bottom:24px; animation:none; }
    .masthead{ background:#fff; color:#000; }
    .eyebrow,.lede,.mast-meta{ color:#333; }
    body,html{ background:#fff; }
    .stat,.card,.callout,.col,ol.steps li,ol.gaps li,.tablewrap{ box-shadow:none; }
  }
</style>
</head>
<body>
  <div id="gate">
    <div class="gcard">
      <div class="glock">&#128274;</div>
      <h1>Private document</h1>
      <p>Enter the passphrase to unlock. This page decrypts entirely in your browser. Nothing you type is sent anywhere.</p>
      <form id="f" autocomplete="off">
        <input id="pw" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="Passphrase" />
        <button id="go" type="submit">Unlock</button>
      </form>
      <div id="err"></div>
    </div>
  </div>

  <div id="app" hidden></div>

  function initNav(){
    var btns=[].slice.call(document.querySelectorAll('.menu button[data-go]'));
    var panels=[].slice.call(document.querySelectorAll('.panels .panel'));
    function show(id){
      panels.forEach(function(p){ p.hidden = (p.id !== 'p-'+id); });
      btns.forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-go')===id); });
      window.scrollTo(0,0);
    }
    btns.forEach(function(b){ b.addEventListener('click', function(){ show(b.getAttribute('data-go')); }); });
  }
  async function unlock(){

    var norm=document.getElementById('pw').value.toLowerCase().replace(/[^a-z0-9]/g,'');

      err.textContent='This browser is blocking decryption. Open this page in Safari or Chrome — in an in-app browser tap Share, then "Open in Safari".';
      return;
    }
    var go=document.getElementById('go'); go.disabled=true; go.textContent='Unlocking…';
    try{
      var work=(async function(){
        var km=await crypto.subtle.importKey('raw', new TextEncoder().encode(norm), 'PBKDF2', false, ['deriveKey']);
        var key=await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(SALT), iterations:ITER, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
        var pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(IV)}, key, b64(DATA));
        return new TextDecoder().decode(pt);
      })();
      var timeout=new Promise(function(_,rej){ setTimeout(function(){ rej(new Error('__timeout__')); }, 9000); });
      var textHtml=await Promise.race([work, timeout]);
      var app=document.getElementById('app');
      app.innerHTML=textHtml;
      document.getElementById('gate').hidden=true;
      app.hidden=false;
      initNav();
      document.title='Handover';
      window.scrollTo(0,0);
    }catch(e){
      if(e && e.message==='__timeout__'){
        err.textContent='Still working after several seconds, which usually means this browser is blocking it. Open the page in Safari or Chrome.';
      } else {
        err.textContent='That passphrase did not work. Check it and try again.';
      }
      go.disabled=false; go.textContent='Unlock';
    }
  }
  document.getElementById('f').addEventListener('submit', function(e){ e.preventDefault(); unlock(); });
  try{ document.getElementById('pw').focus(); }catch(e){}
</script>
</body>
</html>
